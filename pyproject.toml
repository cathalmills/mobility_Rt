[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mobility_rt"
version = "1.0.0"
description = "Mobility-informed renewal equations for time-varying epidemic reproduction numbers on human mobility networks"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "CC-BY-4.0" }
authors = [{ name = "Cathal Mills" }]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pillow",
]

[project.optional-dependencies]
notebooks = ["jupyter"]

[project.scripts]
mobility-rt-run = "mobility_rt.scripts.run_all:main"

[tool.setuptools.packages.find]
include = ["mobility_rt*"]
